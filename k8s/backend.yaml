apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ecommerce-backend:latest
        imagePullPolicy: Never # if local
        env:
        - name: POSTGRES_SERVER
          value: "pgbouncer"
        - name: POSTGRES_PORT
          value: "6432"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        # Dynamic Gunicorn worker limit per mandates (e.g. 1 CPU -> 5 workers)
        - name: WEB_CONCURRENCY
          value: "5" 
        envFrom:
        - secretRef:
            name: app-secrets
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "256Mi"
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"] # Graceful shutdown mandate
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  ports:
  - port: 8000
  selector:
    app: backend
