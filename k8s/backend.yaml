apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      enableServiceLinks: false
      containers:
        - name: backend
          image: ecommerce-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: "/tmp"
            - name: POSTGRES_SERVER
              value: "pgbouncer"
            - name: POSTGRES_PORT
              value: "6432"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            # Dynamic Gunicorn worker limit per mandates (e.g. 1 CPU -> 5 workers)
            - name: WEB_CONCURRENCY
              value: "5"
            - name: BACKUP_DIR
              value: "/backups"
          envFrom:
            - secretRef:
                name: app-secrets
          volumeMounts:
            - name: backup-storage
              mountPath: /backups
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "256Mi"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"] # Graceful shutdown mandate
          ports:
            - containerPort: 8000
      securityContext:
        fsGroup: 102
      volumes:
        - name: backup-storage
          persistentVolumeClaim:
            claimName: postgres-backups-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  ports:
    - port: 8000
  selector:
    app: backend
