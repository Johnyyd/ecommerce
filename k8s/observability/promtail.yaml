apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  labels:
    app: promtail
    component: observability
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
        component: observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: promtail
        image: grafana/promtail:3.2.2
        args:
        - -config.file=/etc/promtail/config.yaml
        ports:
        - containerPort: 3100
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /etc/promtail
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: containers
          mountPath: /var/lib/docker/containers
          readOnly: true
        env:
        - name: LOKI_ADDR
          value: "http://loki:3100"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: config-volume
        configMap:
          name: promtail-config
      - name: varlog
        hostPath:
          path: /var/log
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  labels:
    app: promtail
    component: observability
data:
  config.yaml: |
    server:
      http_listen_port: 3100
      log_level: info
    positions:
      filename: /tmp/positions.yaml
    clients:
    - url: http://loki:3100/loki/api/v1/push
      tenant_id: "ecommerce"
    scrape_configs:
    - job_name: system
      static_configs:
      - targets:
        - localhost
        labels:
          job: system
          host: systemd-journal
          __path__: /var/log/**/*.log
    - job_name: container_logs
      kubernetes:
        namespaces:
          - default
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: __pod__
      - source_labels:
        - __meta_kubernetes_pod_container_name
        target_label: __container__
      - source_labels:
        - __meta_kubernetes_namespace
        target_label: __namespace__
      pipeline_stages:
      - json:
          expressions:
            level: level
      - match:
          selector: '{level="ERROR"} |= "password"'
          drop: true
      - taint:
          key: password
          value: redacted
          action: replace
