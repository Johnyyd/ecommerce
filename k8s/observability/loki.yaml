apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  labels:
    app: loki
    component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        component: observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 102
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: loki
        image: grafana/loki:2.9.4
        command:
        - /usr/bin/loki
        - -config.file=/etc/loki/local-config.yaml
        args:
        - -config.file=/etc/loki/local-config.yaml
        ports:
        - containerPort: 3100
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /etc/loki
        - name: storage-volume
          mountPath: /var/loki
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
  volumeClaimTemplates:
  - metadata:
      name: storage-volume
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
  volumes:
  - name: config-volume
    configMap:
      name: loki-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    app: loki
    component: observability
data:
  local-config.yaml: |
    auth_enabled: true
    server:
      http_listen_port: 3100
      log_level: info
    ingester:
      lifecycler:
        address: self
        ring:
          kvstore:
            store: in-memory
          replication_factor: 1
      final_sleep: 0
      chunk_idle_period: 5m
      chunk_target_size: 1048576
      chunk_retain_period: 1m
      max_transfer_retries: 0
    schema_config:
      configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h
      delete:
        enabled: false
    storage_config:
      bolt:
        directory: /var/loki/index
      boltdb_shipper:
        active_index_directory: /var/loki/index
        cache_location: /var/loki/cache
        shared_store: filesystem
      filesystem:
        directory: /var/loki/chunks
    compactor:
      working_directory: /var/loki/compactor
      delete_request_timeout: 1m
      delete_worker_count: 150
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    chunking:
      max_chunk_age: 1h
      chunk_target_size: 1048576
    table_store:
      schema_state_version: 11
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: loki
    component: observability
spec:
  ports:
  - name: http
    port: 3100
    targetPort: http
  selector:
    app: loki
