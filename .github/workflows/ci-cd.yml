name: E-Commerce CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  backend-ci:
    name: Backend CI (Pytest & Security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov bandit flake8

      - name: Security Scan (Bandit)
        run: bandit -r app/ -c bandit.yaml

      - name: Run Tests (Pytest)
        env:
          SECRET_KEY: "super_secret_key_change_me_in_production"
          POSTGRES_USER: "ecommerce_user"
          POSTGRES_PASSWORD: "ecommerce_password"
          POSTGRES_DB: "ecommerce_db"
        run: pytest tests/ --cov=app --cov-report=xml

  docker-build-push:
    name: Build Docker Images (Local Test)
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================================
      # [TƯƠNG LAI] NẾU MUỐN ĐẨY IMAGE LÊN DOCKER HUB THÌ BỎ COMMENT KHỐI NÀY:
      # Yêu cầu: Cấu hình 2 biến DOCKER_USERNAME và DOCKER_PASSWORD ở Settings > Secrets
      # =========================================================================
      # - name: Log in to Docker Registry
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          # Đang test local nên không push. 
          # Khi đẩy lên cloud, đổi push: false thành true và mở comment dòng tags bên dưới
          push: false 
          tags: ecommerce-backend:latest
          # tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ecommerce-frontend:latest
          # tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:latest

  k8s-deploy:
    # =========================================================================
    # [TƯƠNG LAI] NẾU MUỐN TỰ ĐỘNG DEPLOY LÊN CLOUD K8S (Ví dụ EKS, GKE, DigitalOcean)
    # 1. Đổi 'if: false' thành 'if: github.event_name == ...'
    # 2. Cấu hình biến KUBECONFIG trong GitHub Secrets để GitHub kết nối được tới cụm K8s
    # =========================================================================
    name: Deploy to Kubernetes
    needs: docker-build-push
    if: false # XÓA HOẶC ĐỔI DÒNG NÀY KHI MUỐN DEPLOY LÊN SERVER THẬT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Run Database Migrations (Pre-deploy Job)
        run: |
          kubectl delete job db-migration-job --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          kubectl wait --for=condition=complete job/db-migration-job --timeout=120s

      - name: Update Deployments (Rolling Update)
        run: |
          # Khi deploy thật, K8s phải pull image từ DockerHub, thay thế bằng các dòng sau:
          # kubectl set image deployment/backend backend=${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:${{ github.sha }}
          # kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:${{ github.sha }}
          kubectl set image deployment/backend backend=ecommerce-backend:latest
          kubectl set image deployment/frontend frontend=ecommerce-frontend:latest
          kubectl rollout status deployment/backend --timeout=90s
          kubectl rollout status deployment/frontend --timeout=90s