name: E-Commerce CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  backend-ci:
    name: Backend CI (Pytest & Security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov bandit flake8

      - name: Security Scan (Bandit)
        run: bandit -r app/ -c bandit.yaml

      - name: Run Tests (Pytest)
        env:
          SECRET_KEY: "super_secret_key_change_me_in_production"
          POSTGRES_USER: "ecommerce_user"
          POSTGRES_PASSWORD: "ecommerce_password"
          POSTGRES_DB: "ecommerce_db"
        run: pytest tests/ --cov=app --cov-report=xml

  docker-build-push:
    name: Build & Push Docker Images
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: your-registry/ecommerce-backend:${{ github.sha }},your-registry/ecommerce-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: your-registry/ecommerce-frontend:${{ github.sha }},your-registry/ecommerce-frontend:latest

  k8s-deploy:
    name: Deploy to Kubernetes
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Run Database Migrations (Pre-deploy Job)
        run: |
          kubectl delete job db-migration-job --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          kubectl wait --for=condition=complete job/db-migration-job --timeout=120s

      - name: Update Deployments (Rolling Update)
        run: |
          kubectl set image deployment/backend backend=your-registry/ecommerce-backend:${{ github.sha }}
          kubectl set image deployment/frontend frontend=your-registry/ecommerce-frontend:${{ github.sha }}
          kubectl rollout status deployment/backend --timeout=90s
          kubectl rollout status deployment/frontend --timeout=90s