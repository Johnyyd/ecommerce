name: developer_uiux
version: "1.0"
description: "UI/UX Designer agent for user interface and experience design"

defaults:
  runtime: claude-code

imports:
  - ref: local:../../shared

profiles:
  default:
    uses:
      skills: []
      guidance: []
      subagents: []
      permission_policy:
      launch_posture: "floor"
      permissions: []
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []