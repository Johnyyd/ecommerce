name: review_independent
version: "1.0"
description: Independent code reviewer — analyzes code and writes findings

defaults:
  runtime: claude-code

imports:
  - ref: local:../../shared

profiles:
  default:
    uses:
      skills:
        [review-team, systematic-debugging, verification-before-completion]
      guidance: []
      subagents: []
      permission_policy:
      launch_posture: "floor"
      permissions: []
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
