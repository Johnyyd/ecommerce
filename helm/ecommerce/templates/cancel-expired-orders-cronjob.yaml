{{- if .Values.cancelExpiredOrders.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ecommerce.fullname" . }}-cancel-expired-orders
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    app: cancel-expired-orders
    component: cronjob
spec:
  schedule: {{ .Values.cancelExpiredOrders.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cancelExpiredOrders.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cancelExpiredOrders.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "ecommerce.selectorLabels" . | nindent 12 }}
            app: cancel-expired-orders
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: cancel-orders
            image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
            imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
            command: ["python", "-m", "app.worker.cancel_expired_orders_task"]
            envFrom:
            - secretRef:
                name: app-secrets
            env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: MEILISEARCH_URL
              value: "http://meilisearch:7700"
            - name: PAYOS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PAYOS_CLIENT_ID
            - name: PAYOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PAYOS_API_KEY
            - name: PAYOS_CHECKSUM_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PAYOS_CHECKSUM_KEY
            resources:
              {{- toYaml .Values.cancelExpiredOrders.resources | nindent 14 }}
          nodeSelector:
            kubernetes.io/os: linux
{{- end }}