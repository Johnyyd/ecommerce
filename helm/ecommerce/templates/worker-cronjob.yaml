{{- if .Values.worker.enabled -}}
{{- if .Values.worker.cronJob.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ecommerce.fullname" . }}-worker-cancel-expired
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    app: worker-cancel-expired
    component: cronjob
spec:
  schedule: "{{ .Values.worker.cronJob.schedule }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.worker.cronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.worker.cronJob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: worker-cancel-expired
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: cancel-expired-orders
            image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
            imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
            command: ["python", "-c", "from app.worker import cancel_expired_orders_task; import asyncio; asyncio.run(cancel_expired_orders_task(None))"]
            env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: MEILISEARCH_URL
              value: "http://meilisearch:7700"
            - name: PAYOS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PAYOS_CLIENT_ID
            - name: PAYOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PAYOS_API_KEY
            - name: PAYOS_CHECKSUM_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PAYOS_CHECKSUM_KEY
            envFrom:
            - secretRef:
                name: app-secrets
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          nodeSelector:
            kubernetes.io/os: linux
{{- end }}
{{- end }}