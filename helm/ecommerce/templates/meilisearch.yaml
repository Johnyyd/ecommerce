{{- if .Values.meilisearch.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ecommerce.fullname" . }}-meilisearch
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    app: meilisearch
spec:
  serviceName: {{ include "ecommerce.fullname" . }}-meilisearch
  replicas: {{ .Values.meilisearch.replicaCount }}
  selector:
    matchLabels:
      {{- include "ecommerce.selectorLabels" . | nindent 6 }}
      app: meilisearch
  template:
    metadata:
      labels:
        {{- include "ecommerce.selectorLabels" . | nindent 8 }}
        app: meilisearch
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.meilisearch.securityContext.runAsUser }}
        runAsGroup: {{ .Values.meilisearch.securityContext.runAsGroup }}
        fsGroup: {{ .Values.meilisearch.securityContext.fsGroup }}
      containers:
        - name: meilisearch
          image: "{{ .Values.meilisearch.image.repository }}:{{ .Values.meilisearch.image.tag }}"
          imagePullPolicy: {{ .Values.meilisearch.image.pullPolicy }}
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MEILISEARCH_MASTER_KEY
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: MEILI_ENV
              value: "{{ .Values.meilisearch.environment }}"
          ports:
            - containerPort: {{ .Values.meilisearch.service.port }}
              name: http
          volumeMounts:
            - name: meilisearch-data
              mountPath: /meili_data
          resources:
            {{- toYaml .Values.meilisearch.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: meilisearch-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.meilisearch.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.meilisearch.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce.fullname" . }}-meilisearch
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    app: meilisearch
spec:
  type: {{ .Values.meilisearch.service.type }}
  ports:
    - port: {{ .Values.meilisearch.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ecommerce.selectorLabels" . | nindent 4 }}
    app: meilisearch
{{- end }}