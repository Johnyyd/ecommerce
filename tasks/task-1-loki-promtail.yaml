task_id: task-1-loki-promtail
title: "Centralized Logging - Grafana Loki + Promtail DaemonSet"
phase: 1
priority: P1
status: READY
assigned_to: devops.devops_engineer
reviewed_by: devops.devops_architect
estimated_effort: 2 days

description: |
  Deploy Grafana Loki for centralized log aggregation and Promtail DaemonSet for log collection.
  This eliminates the need for `kubectl logs` and provides unified log viewing in Grafana.

requirements:
  - Loki StatefulSet with persistent storage (7-day retention)
  - Promtail DaemonSet collecting from /var/log/pods
  - Parse K8s labels (app, pod, namespace) and extract JSON log fields
  - Add Loki datasource to Grafana datasources

files_to_create:
  - k8s/observability/loki.yaml
  - k8s/observability/promtail.yaml
  - k8s/observability/grafana-datasources.yaml (UPDATE: add Loki)

files_to_reference:
  - k8s/backend.yaml (for log format reference)
  - backend/app/core/logging.py (structured JSON log format)
  - monitoring/grafana/datasources.yaml (existing datasources)

acceptance_criteria:
  - Loki StatefulSet running with PVC for storage
  - Promtail DaemonSet running on all nodes
  - Grafana Explore → Loki datasource → Query `{app="backend"} |= "ERROR"` returns logs
  - Logs show proper K8s labels and JSON fields
  - Retention configured to 7 days

technical_details:
  loki:
    image: grafana/loki:2.9.x
    ports:
      - 3100 (HTTP)
    storage:
      filesystem:
        directory: /loki
    limits_config:
      retention_period: 168h  # 7 days
  
  promtail:
    image: grafana/promtail:2.9.x
    mounts:
      - /var/log/pods:/var/log/pods:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    config:
      clients:
        - url: http://loki:3100/loki/api/v1/push
      positions:
        filename: /tmp/positions.yaml
      scrape_configs:
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app]
              target_label: app
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
          pipeline_stages:
            - json:
                expressions:
                  level: level
                  message: message
                  trace_id: trace_id

validation_commands:
  - kubectl get statefulset loki -n observability
  - kubectl get daemonset promtail -n observability
  - kubectl get svc loki -n observability
  - kubectl logs -n observability -l app=loki --tail=20
  - kubectl logs -n observability -l app=promtail --tail=20
  - curl -s http://loki:3100/ready
  - Grafana: Explore → Loki → {app="backend"} |= "ERROR"

dependencies: []
parallel_with: ["task-3-helm-charts"]

notes: |
  Follow K8s security patterns from k8s/backend.yaml:18-24:
  - runAsNonRoot: true
  - readOnlyRootFilesystem: true
  - drop: [ALL]
  - seccompProfile: RuntimeDefault
