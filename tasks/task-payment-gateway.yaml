YOUR WORK (1 day):
1. **PayOS Sandbox Integration Testing** - Register/configure PayOS sandbox credentials
2. **Test PayOSService.create_payment_link()** with real API (currently uses VietQR image generation fallback)
3. **End-to-end flow test**: Create order → Payment link → Webhook → Auto-cancel
4. **Verify HMAC signature** works with real PayOS webhooks
5. **Test auto-cancel via PayOS API** (cancel_payment_link)
6. **Document PayOS credentials** in .env.example

